<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05_06_2025</title>
    <script src="form5.js"></script>
    <style>
        .colorClass {
            color: red;
        }
    </style>
</head>

<body>
    <form name="formName" onsubmit="return validate()">
        <div>
            <label for="nameId">Name</label>
            <span class="colorClass">*</span>
            <span>:</span>
            <input type="text" name="nameName" id="nameId" required>
            <span id="spanNameId"></span>
        </div>

        <div>
            <label for="emailId">E-mail</label>
            <span class="colorClass">*</span>
            <span>:</span>
            <input type="email" name="emailEmail" id="emailId" required>
            <span id="spanEmailId"></span>
        </div>

        <div>
            <label for="passwordId">Password</label>
            <span class="colorClass">*</span>
            <span>:</span>
            <input type="password" name="passwordPassword" id="passwardId" required>
            <span id="spanPasswordId"></span>
        </div>

        <div>
            <label for="cpasswordId">Confirm Password</label>
            <span class="colorClass">*</span>
            <span>:</span>
            <input type="password" name="confirmPassword" id="cpasswardId" required>
            <span id="spanCpasswordId"></span>
        </div>

        <div>
            <label for="genderId">Gender</label>
            <span class="colorClass">*</span>
            <span>:</span>
            <label for=""><input type="radio" name="genderGender" id="genderId" value="female">Female</label>

            <label for=""><input type="radio" name="genderGender" id="genderId" value="male">Male</label>

            <span id="spangenderId"></span>
        </div>

        <div>
            <label for="courseId" name="courseCourse">Course</label>
            <span class="colorClass">*</span>
            <span>:</span>
            <label for=""><input type="checkbox" name="courseCourse" id="courseId">Java</label>

            <label for=""><input type="checkbox" name="courseCourse" id="courseId">SQL</label>

            <label for=""><input type="checkbox" name="courseCourse" id="courseId">Web</label>

            <span id="spanCourseId"></span>
        </div>

        <div>
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
        </div>
    </form>
</body>

</html>
