<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCB Players</title>
    <link rel="icon" href="image.png" type="image/x-icon">
    <style>
        .fixed {
            position: relative;
            left: 0;
        }

        .virat {
            position: absolute;
            top: 0;
            left: 0;
        }

        .rajat {
            position: absolute;
            top: 0;
            left: 0;
            margin-left: 400px;
        }

        .phil {
            position: absolute;
            top: 250px;
            left: 0;
            margin-left: 200px;
        }

        .jitesh {
            position: absolute;
            top: 250px;
            left: 0;
            margin-left: 0px;
        }

        .yash {
            position: absolute;
            top: 250px;
            left: 0;
            margin-left: 400px;
        }

        .liam {
            position: absolute;
            bottom: 0;
            left: 0;
            margin-left: 400px;
        }

        .josh {
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .faf {
            position: absolute;
            top: 100px;
            left: 0;
            margin-left: 150px;
        }

        .maxwell {
            position: absolute;
            bottom: 100px;
            left: 0;
            margin-left: 250px;
        }

        .siraj {
            position: absolute;
            top: 100px;
            left: 0;
            margin-left: 350px;
        }

        ul.horizontal,
        ul.vertical {
            list-style-type: none;
            background-color: white;
            padding: 0;
            margin: 0;
        }

        ul.horizontal li {
            display: inline-block;
            padding: 20px 30px;
            margin-left: 20px;
        }

        ul.vertical li {
            display: block;
            padding: 15px 30px;
            margin-top: 10px;

        }

        li {
            color: rgb(19, 4, 4);
            transition: background-color 0.3s;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        li {
            color: rgb(19, 4, 4);
            padding: 10px;
        }

        li:hover {
            background-color: blue;
            color: white;
        }

        a {
            text-decoration: none;
            color: #000;
            font-weight: bold;
        }

        button {
            background-color: white;
            border: 1px solid #ccc;
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <ul class="horizontal">
        <li >
                <button><a href="https://www.facebook.com/" target="_blank">facebook</a></button>
        </li>

        <li><button><a href="https://www.instagram.com/accounts/login/?hl=en" target="_blank">Instagram</a></button>
        </li>
        <li><button><a href="https://www.youtube.com/" target="_blank">Youtube</a></button></li>

    </ul>
    <ul class="vertical">
        <li>
            <a href="https://www.facebook.com/" target="_blank">
                <img src="image copy 11.png" height="40px" width="40px" style="vertical-align: middle;">
            </a>
            <button><a href="https://www.facebook.com/" target="_blank">Facebook</a></button>
        </li>
        <li>
            <a href="https://www.instagram.com/accounts/login/?hl=en" target="_blank">
                <img src="image copy 12.png" height="40px" width="40px" style="vertical-align: middle;">
            </a>
            <button><a href="https://www.instagram.com/accounts/login/?hl=en" target="_blank">Instagram</a></button>
        </li>
        <li>
            <a href="https://www.youtube.com/" target="_blank">
                <img src="image copy 13.png" height="40px" width="40px" style="vertical-align: middle;">
            </a>
            <button><a href="https://www.youtube.com/" target="_blank">YouTube</a></button>
        </li>
    </ul>

    <hr style="height: 2px; background-color: black; border: none; margin: 20px 0;">


    <div class="fixed">
        <img src="image.png" height="500" width="500">
        <span class="virat"><button><a href="image copy.png">Virat Kohli</a></button></span>
        <span class="rajat"><button><a href="image copy 2.png">Rajat Patidar</a></button></span>
        <span class="phil"><button><a href="image copy 3.png">Phil Salt</a></button></span>
        <span class="jitesh"><button><a href="image copy 4.png">Jitesh Sharma</a></button></span>
        <span class="yash"><button><a href="image copy 5.png">Yash Dayal</a></button></span>
        <span class="liam"><button><a href="image copy 6.png">Liam Livingstone</a></button></span>
        <span class="josh"><button><a href="image copy 7.png">Josh Hazlewood</a></button></span>
        <span class="faf"><button><a href="image copy 8.png">Faf du Plessis</a></button></span>
        <span class="maxwell"><button><a href="image copy 9.png">Glenn Maxwell</a></button></span>
        <span class="siraj"><button><a href="image copy 10.png">Mohammed Siraj</a></button></span>

</html>
