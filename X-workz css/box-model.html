<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        .model{
            border: 5px dotted red;
            margin: 10px 20px 10px 20px;
            padding: 10px 40px ;
        }
        .box1{
            border: 2px solid rebeccapurple;
            padding: 10px 40px ;
            height: 200px;
            width: 200px;
            background-color: cadetblue;
           
        }
        .box2{
            border: 2px solid brown;
        
            margin: 40px 20px;
            height: 100px;
            width: 170px;
            background-color: chartreuse;
        }
        div p{     /*desendent selector*/
            color: blue;
        }

        div >p{       /*Child selector*/
            color: brown;
        }

        div +p{    /*adjacent sibling selector*/
            color: blueviolet;
        } 
        div ~ p{      /*general sibling selector*/
            color: cadetblue;
        }
    </style>
</head>
<body>
    <div class="model" >CSS Box Model</div>
    <div class="box1" >
        <div class="box2"></div>
    </div>
    <div>
        <p>The headlines</p>
        <p>The animals from mysore zoo has escaped </p>
        <span>
            <p>Be Careful</p>
        </span>
    </div>
    <p>The news has spred over Mysore</p>
    <div>
    <p>Be Carefull </p>
</div>
</body>
</html>
