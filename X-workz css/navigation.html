<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style-type: none;
            background-color: lightpink;
        }

        ul li {

            display: inline-block;

        }

        body {
            margin: 0;
        }

        li {
            color: white;
            padding: 10px;
        }

        li:hover {
            background-color: blue;
        }

        a {
            text-decoration: solid;
            color: #000;
        }

        button {
            background-color: aqua;
        }
    </style>
</head>

<body>
    <ul>
        <li><button><a href="https://www.facebook.com/" target="_blank">facebook</a></button></li>

        <li><button><a href="https://www.instagram.com/accounts/login/?hl=en" target="_blank">Instagram</a></button>
        </li>
        <li><button><a href="https://www.youtube.com/" target="_blank">Youtube</a></button></li>

    </ul>
</body>

</html>
