<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Page Layout</title>
  <link rel="stylesheet" href="day1.css">
</head>
<body>

  <div class="navbar">
    <button>Home</button>
    <button>Information</button>
    <button>About</button>
  </div>

  <div class="container">
    <div class="content">
      <h2>Website</h2>
      <p>This is a simple user interface created using HTML.</p>
      <img src="image copy.png" height="100px" alt="Added image">
    </div>
    <div class="form">
      <h3>Form</h3>
      <input type="text" placeholder="Enter Name"><br>
      <input type="email" placeholder="Enter Email"><br>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </div>
  </div>

  <div class="footer">&copy; 2025 MyWebsite. All rights reserved.</div>

</body>
</html>
