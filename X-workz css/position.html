<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCB Players</title>
    <link rel="icon" href="image.png" type="image/x-icon">
    <style>
        .fixed {
            position: relative;
            left: 0;
        }

        .virat {
            position: absolute;
            top: 0;
            left: 0;
        }

        .rajat {
            position: absolute;
            top: 0;
            left: 0;
            margin-left: 400px;
        }

        .phil {
            position: absolute;
            top: 250px;
            left: 0;
            margin-left: 200px;
        }

        .jitesh {
            position: absolute;
            top: 250px;
            left: 0;
            margin-left: 0px;
        }

        .yash {
            position: absolute;
            top: 250px;
            left: 0;
            margin-left: 400px;
        }

        .liam {
            position: absolute;
            bottom: 0;
            left: 0;
            margin-left: 400px;
        }

        .josh {
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .faf {
            position: absolute;
            top: 100px;
            left: 0;
            margin-left: 150px;
        }

        .maxwell {
            position: absolute;
            bottom: 100px;
            left: 0;
            margin-left: 250px;
        }

        .siraj {
            position: absolute;
            top: 100px;
            left: 0;
            margin-left: 350px;
        }
        ul{
            list-style-type: none;
            background-color: lightpink;
        }
        ul li{
            
            display: inline-block;
            
        }
        body{
            margin: 0;
        }
        li{
            color: white;
            padding: 10px;
        }
        li:hover{
            background-color: blue;
        }
    </style>
</head>

<body>
    <ul>
        <li>Home</li>
        <li>Java</li>
        <li>HTML</li>
        <li>CSS</li>
        <li>About</li>
    </ul>
    <div class="fixed">
        <img src="image.png" height="500" width="500">
        <span class="virat">Virat Kohli</span>
        <span class="rajat">Rajat Patidar</span>
        <span class="phil">Phil Salt</span>
        <span class="jitesh">Jitesh Sharma</span>
        <span class="yash">Yash Dayal</span>
        <span class="liam">Liam Livingstone</span>
        <span class="josh">Josh Hazlewood</span>
        <span class="faf">Faf du Plessis</span>
        <span class="maxwell">Glenn Maxwell</span>
        <span class="siraj">Mohammed Siraj</span>
    </div>
</body>

</html>
